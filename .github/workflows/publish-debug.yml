name: Publish Build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown on the download page"
        required: false
        default: "Test build"
      notify:
        description: "Ping the household Discord"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # A debug APK cannot be published: it skips R8, so its 25 dex files alone come to ~125MB
      # and the whole APK lands near 160MB, over the 100MB body limit the API sits behind. The
      # release build is shrunk and fits with room to spare. Signed with the same throwaway
      # keystore phone-release.yml uses -- not the official release key.
      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v5
        with:
          path: vz-pixelplay.jks
          key: ${{ runner.os }}-keystore-vz-pixelplay

      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore vz-pixelplay.jks -alias pixelplay-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass 994273 -keypass 994273 \
            -dname "CN=PixelPlay, OU=Dev, O=PixelPlay, L=World, S=World, C=US"

      - name: Create keystore.properties
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=pixelplay-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build phone release APK
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Verify APK is signed and well formed
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$APK"

      # Fail here, with a readable message, rather than after spending minutes uploading only for
      # the proxy to answer 413 with an HTML error page.
      - name: Check APK fits the upload limit
        run: |
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          LIMIT_MB=100
          SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
          echo "APK is ${SIZE_MB}MB (limit ${LIMIT_MB}MB)"
          if [ "$SIZE_MB" -ge "$LIMIT_MB" ]; then
            echo "::error::APK is ${SIZE_MB}MB, at or over the ${LIMIT_MB}MB upload limit. Publishing would fail with HTTP 413."
            exit 1
          fi

      - name: Compute version tag
        id: version
        run: echo "value=release-$(date +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Publish to downloader site
        run: |
          curl --fail-with-body \
            -F "apk=@app/build/outputs/apk/release/app-arm64-v8a-release.apk" \
            -F "version=${{ steps.version.outputs.value }}" \
            -F "notes=${{ inputs.notes }}" \
            -F "notify=${{ inputs.notify }}" \
            -H "Authorization: Bearer ${{ secrets.XPS_RELEASE_TOKEN }}" \
            https://api.tinotenda.co/api/v1/releases/pixelplayer/publish
