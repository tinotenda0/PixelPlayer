name: Publish Debug Build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes shown on the download page"
        required: false
        default: "Debug build"
      notify:
        description: "Ping the household Discord"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build phone debug APK
        run: gradle :app:assembleDebug -Ppixelplay.enableAbiSplits=true

      - name: Compute version tag
        id: version
        run: echo "value=debug-$(date +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Publish to downloader site
        run: |
          curl --fail-with-body \
            -F "apk=@app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" \
            -F "version=${{ steps.version.outputs.value }}" \
            -F "notes=${{ inputs.notes }}" \
            -F "notify=${{ inputs.notify }}" \
            -H "Authorization: Bearer ${{ secrets.XPS_RELEASE_TOKEN }}" \
            https://api.tinotenda.co/api/v1/releases/pixelplayer/publish
